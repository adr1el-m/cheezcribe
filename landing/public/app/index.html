<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Paperazzi turns legacy documents into traceable, reviewable digital assets.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Paperazzi">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Paperazzi</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      color-scheme: light;
      background: #f3f6f9;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 50% 35%, rgba(23, 105, 232, 0.1), transparent 34%),
        linear-gradient(145deg, #f9fbfd, #e9eef4);
    }

    .device-stage {
      display: grid;
      width: 100%;
      height: 100dvh;
      place-items: center;
    }

    .device-shell,
    .device-screen,
    #flutter-host,
    flutter-view {
      width: 100%;
      height: 100%;
    }

    .device-shell {
      position: relative;
      background: #fff;
    }

    .device-screen,
    #flutter-host {
      position: relative;
      overflow: hidden;
      background: #fff;
    }

    .dynamic-island,
    .device-button {
      display: none;
    }

    @media (min-width: 700px) {
      .device-shell {
        width: auto;
        max-width: calc(100vw - 48px);
        height: min(932px, calc(100dvh - 24px));
        box-sizing: border-box;
        padding: 9px;
        border: 1px solid #555a60;
        border-radius: 58px;
        aspect-ratio: 430 / 932;
        background:
          linear-gradient(100deg, #0b0c0e 0%, #35383c 7%, #090a0b 15%, #17191b 85%, #55595d 94%, #0a0b0c 100%);
        box-shadow:
          0 32px 70px rgba(16, 27, 45, 0.24),
          0 8px 22px rgba(16, 27, 45, 0.2),
          inset 0 0 0 1px rgba(255, 255, 255, 0.2);
      }

      .device-screen {
        position: absolute;
        z-index: 1;
        inset: 9px;
        width: auto;
        height: auto;
        border-radius: 49px;
      }

      #flutter-host {
        box-sizing: border-box;
        height: calc(100% - 40px);
        margin-top: 40px;
      }


      .dynamic-island {
        position: absolute;
        z-index: 20;
        top: 20px;
        left: 50%;
        display: block;
        width: 112px;
        height: 32px;
        border-radius: 999px;
        background: #050506;
        box-shadow: inset 0 -1px 1px rgba(255, 255, 255, 0.08);
        pointer-events: none;
        transform: translateX(-50%);
      }


      .device-button {
        position: absolute;
        z-index: -1;
        display: block;
        width: 5px;
        border-radius: 3px 0 0 3px;
        background: linear-gradient(to right, #111315, #555a60);
      }

      .device-button--mute {
        top: 118px;
        left: -5px;
        height: 28px;
      }

      .device-button--volume-up {
        top: 166px;
        left: -5px;
        height: 58px;
      }

      .device-button--volume-down {
        top: 235px;
        left: -5px;
        height: 58px;
      }

      .device-button--power {
        z-index: -1;
        top: 184px;
        right: -5px;
        width: 5px;
        height: 88px;
        border-radius: 0 3px 3px 0;
        background: linear-gradient(to left, #111315, #555a60);
      }
    }
  </style>
</head>
<body>
  <main class="device-stage">
    <div class="device-shell" aria-label="Paperazzi mobile application">
      <span class="dynamic-island" aria-hidden="true"></span>
      <span class="device-button device-button--mute" aria-hidden="true"></span>
      <span class="device-button device-button--volume-up" aria-hidden="true"></span>
      <span class="device-button device-button--volume-down" aria-hidden="true"></span>
      <span class="device-button device-button--power" aria-hidden="true"></span>
      <div class="device-screen">
        <div id="flutter-host"></div>
      </div>
    </div>
  </main>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
