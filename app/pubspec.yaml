name: appcon_starter
description: A mobile-first Flutter foundation for AppCon 2026.
publish_to: none
version: 0.1.0+1
environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 4.15.0
  firebase_ai: 4.0.0
  firebase_app_check: 0.4.8
  shared_preferences: 2.5.5
  flutter_svg: 2.2.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/demo/synthetic_directory_1978.jpg
    - assets/icons/
  config:
    enable-swift-package-manager: true
